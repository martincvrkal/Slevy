name: Denní stahování akcí

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: denne-akce
  cancel-in-progress: false

jobs:
  stahovani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testy
        run: python -m unittest discover tests
      - name: Stáhnout a zpracovat akce
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.run
      - name: Uložit nová data
        run: |
          git config user.name "slevy-bot"
          git config user.email "slevy-bot@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "Žádná změna dat."
          else
            git commit -m "Akce $(date -u +%Y-%m-%d)"
            git push
          fi
